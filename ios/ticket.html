<!doctype html>
<html lang="en" class="ios">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="mvp-screen" content="Events & Tickets">
<title>Ticket · Blissers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+Hebrew:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="../assets/tailwind.config.js"></script>
<link rel="stylesheet" href="../assets/theme.css">
</head>
<body class="ios">
<main class="scroll" id="content"><div id="view" class="stagger"></div></main>

<script src="../assets/i18n.js"></script>
<script src="../assets/app.js"></script>
<script>
  (function () {
    const { esc, icon, money, fdate, fstamp, state } = BL;
    const t = BL.ticket(BL.qs("id"));
    const e = t && BL.event(t.eventId);
    BL.ios.shell({ title: e ? e.title : "Ticket", back: "events.html?tab=mine", backLabel: "Tickets", tab: "events" });
    const view = document.getElementById("view");
    if (!t) { view.innerHTML = `<div class="empty mt-10"><span class="tile">${icon("ticket")}</span><h3>No ticket here</h3><p>It may have been reset with the demo data.</p><a class="btn btn-primary btn-sm" href="events.html">Events</a></div>`; return; }
    let timer = null;
    function draw() {
      clearInterval(timer);
      const amount = e.price * t.qty; const pay = t.paymentId && BL.payment(t.paymentId);
      const head = `<div class="card pad-lg mb-5 text-center" style="background:var(--graphite)"><p class="muted text-sm">${fdate(e.date, "long")} · ${e.time}</p><h1 style="font-size:24px">${esc(e.title)}</h1><p class="muted text-sm">${esc(e.venue)} · ${BL.plural(t.qty, "ticket")}</p></div>`;
      if (t.status === "held") {
        const left = t.holdUntil - Date.now();
        view.innerHTML = `${head}
          <div class="flex flex-col items-center text-center gap-2 mb-6"><span class="tile" style="width:64px;height:64px;color:var(--wait)">${icon("clock", "lg")}</span><p class="num" style="font-size:34px;font-weight:500" id="clock">${BL.timeLeft(left)}</p><p class="muted text-sm">Held for you. Pay before the clock runs out or the tickets go back on sale.</p></div>
          <div class="kv mb-6"><dt>Tickets</dt><dd>${t.qty} × ${money(e.price)}</dd><dt>Total</dt><dd>${money(amount)}</dd><dt>Code</dt><dd class="num">${t.code}</dd></div>
          <a class="btn btn-primary btn-lg btn-block mb-2" href="pay.html?tickets=${t.id}">Pay ${money(amount)}</a>
          <button class="btn btn-ghost btn-block" id="release">Release the hold</button>`;
        timer = setInterval(() => { const l = t.holdUntil - Date.now(); if (l <= 0) { BL.expireHolds(); draw(); return; } document.getElementById("clock").textContent = BL.timeLeft(l); }, 1000);
      } else if (t.status === "paid" || t.status === "checked_in") {
        view.innerHTML = `${head}
          <div class="card pad-lg flex flex-col items-center gap-3 mb-5">${BL.qr(t.code)}<p class="num" style="font-size:22px;letter-spacing:.08em">${t.code}</p>${t.status === "checked_in" ? `<span class="badge badge-ok">${icon("check", "sm")}Checked in ${fstamp(t.checkedInAt)}</span>` : `<p class="muted text-sm text-center">Show this at the door. One scan admits ${t.qty === 1 ? "you" : `all ${t.qty}`}.</p>`}</div>
          <div class="kv mb-6"><dt>Tickets</dt><dd>${t.qty}</dd><dt>Paid</dt><dd>${amount ? money(amount) : "Free"}${pay ? ` · ${esc(pay.method)}` : ""}</dd><dt>When</dt><dd>${fstamp(t.paidAt)}</dd></div>
          <div class="group">
            <button class="row press" id="applewallet">${icon("phoneDevice", "sm")}<span class="body"><span class="title">Add to Apple Wallet</span></span>${icon("chevron-right", "sm chev")}</button>
            <button class="row press" id="share">${icon("external", "sm")}<span class="body"><span class="title">Share with friends</span><span class="sub">Send the code to the others</span></span>${icon("chevron-right", "sm chev")}</button>
            <a class="row press" href="event.html?id=${e.id}">${icon("ticket", "sm")}<span class="body"><span class="title">Event details</span></span>${icon("chevron-right", "sm chev")}</a>
            <a class="row press" href="support-chat.html?new=1">${icon("headset", "sm")}<span class="body"><span class="title">Message support</span></span>${icon("chevron-right", "sm chev")}</a>
          </div>`;
      } else {
        view.innerHTML = `${head}<div class="empty"><span class="tile">${icon("clock")}</span><h3>The hold ran out</h3><p>These tickets went back on sale. Pick again and you get ten more minutes.</p><a class="btn btn-primary btn-sm" href="event.html?id=${e.id}">Back to the event</a></div>`;
      }
      Array.from(view.children).forEach((c, i) => c.style.setProperty("--i", Math.min(i, 14)));
    }
    draw();
    BL.on(view, "click", "#release", async () => { if (!(await BL.confirm({ title: "Release the hold?", body: "The tickets go back on sale straight away.", ok: "Release", danger: true }))) return; BL.releaseHold(t.id); BL.toast("Hold released"); draw(); });
    BL.on(view, "click", "#applewallet", () => BL.toast("Added to Apple Wallet"));
    BL.on(view, "click", "#share", () => { try { navigator.clipboard && navigator.clipboard.writeText(`${e.title}, ${fdate(e.date)} ${e.time}. Code ${t.code}`); } catch (x) {} BL.toast("Copied, paste it to your friends"); });
  })();
</script>
</body>
</html>
