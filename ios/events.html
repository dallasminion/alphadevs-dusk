<!doctype html>
<html lang="en" class="ios">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="mvp-screen" content="Events & Tickets">
<title>Events · Blissers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+Hebrew:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="../assets/tailwind.config.js"></script>
<link rel="stylesheet" href="../assets/theme.css">
</head>
<body class="ios">
<main class="scroll" id="content">
  <h1 class="large-title">Events</h1>
  <div class="seg mb-5" id="seg" role="group" aria-label="Show">
    <button data-tab="all" class="is-on" aria-pressed="true">All</button>
    <button data-tab="mine" aria-pressed="false">My tickets</button>
  </div>
  <div id="list"></div>
</main>

<script src="../assets/i18n.js"></script>
<script src="../assets/app.js"></script>
<script>
  (function () {
    const { esc, icon, money, fdate, state } = BL;
    BL.ios.shell({ title: "Events", tab: "events", large: true });
    let tab = BL.qs("tab") === "mine" ? "mine" : "all";
    const events = state.events.filter((e) => e.status !== "past" && BL.daysUntil(e.date) >= 0).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
    const mine = BL.myTickets().filter((t) => t.status !== "released").sort((a, b) => BL.event(a.eventId).date.localeCompare(BL.event(b.eventId).date));
    const erow = (e) => { const v = BL.vendor(e.vendorId); const left = BL.ticketsLeft(e); const t = mine.find((x) => x.eventId === e.id && x.status !== "released"); return `<a class="row press" href="event.html?id=${e.id}"><span class="tile" style="flex-direction:column;line-height:1.05"><small class="text-caption muted" style="font-size:10px">${fdate(e.date, "short").split(" ")[0]}</small><strong>${fdate(e.date, "short").split(" ")[1]}</strong></span><span class="body"><span class="title block truncate">${esc(e.title)}</span><span class="sub block truncate">${e.time} · ${esc(e.venue)}${v ? ` · ${esc(v.area)}` : ""}</span></span><span class="right">${t ? BL.badge(t.status) : e.status === "sold_out" || left <= 0 ? BL.badge("sold_out") : e.price ? money(e.price) : "Free"}</span>${icon("chevron-right", "sm chev")}</a>`; };
    const trow = (t) => { const e = BL.event(t.eventId); return `<a class="row press" href="ticket.html?id=${t.id}"><span class="tile">${icon("ticket")}</span><span class="body"><span class="title block truncate">${esc(e.title)}</span><span class="sub block truncate">${fdate(e.date)} ${e.time} · ${BL.plural(t.qty, "ticket")}${t.status === "held" ? ` · <span data-countdown="${t.holdUntil}">${BL.timeLeft(t.holdUntil - Date.now())}</span> to pay` : ""}</span></span><span class="right">${BL.badge(t.status)}</span>${icon("chevron-right", "sm chev")}</a>`; };
    function draw() {
      document.querySelectorAll("#seg button").forEach((b) => { const on = b.dataset.tab === tab; b.classList.toggle("is-on", on); b.setAttribute("aria-pressed", String(on)); });
      const list = document.getElementById("list");
      if (tab === "all") {
        const week = events.filter((e) => BL.daysUntil(e.date) <= 7), later = events.filter((e) => BL.daysUntil(e.date) > 7);
        BL.render(list, events.length ? `${week.length ? `<section class="section"><div class="section-title"><h2>This week</h2></div><div class="group stagger">${week.map(erow).join("")}</div></section>` : ""}${later.length ? `<section class="section"><div class="section-title"><h2>Later</h2></div><div class="group stagger">${later.map(erow).join("")}</div></section>` : ""}` : `<div class="empty"><span class="tile">${icon("ticket")}</span><h3>No events on sale</h3><p>New nights are added through the week.</p></div>`);
      } else {
        BL.render(list, mine.length ? `<div class="group stagger">${mine.map(trow).join("")}</div>` : `<div class="empty"><span class="tile">${icon("ticket")}</span><h3>No tickets yet</h3><p>Hold a ticket for ten minutes, pay, and it lives here.</p><button class="btn btn-secondary btn-sm" data-tab="all">Browse events</button></div>`);
      }
      list.querySelectorAll(".stagger").forEach((g) => Array.from(g.children).forEach((c, i) => c.style.setProperty("--i", Math.min(i, 14))));
    }
    draw();
    BL.on(document.body, "click", "[data-tab]", (e, b) => { tab = b.dataset.tab; history.replaceState(null, "", tab === "mine" ? "events.html?tab=mine" : "events.html"); draw(); });
    setInterval(() => { document.querySelectorAll("[data-countdown]").forEach((el) => { const left = Number(el.dataset.countdown) - Date.now(); if (left <= 0) { BL.expireHolds(); location.reload(); } else el.textContent = BL.timeLeft(left); }); }, 1000);
  })();
</script>
</body>
</html>
