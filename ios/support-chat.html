<!doctype html>
<html lang="en" class="ios">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="mvp-screen" content="Support & Feedback">
<title>Support chat · Dusk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+Hebrew:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="../assets/tailwind.config.js"></script>
<link rel="stylesheet" href="../assets/theme.css">
</head>
<body class="ios">
<main class="scroll no-tabs" id="content" style="padding-bottom:140px"><div id="top"></div><div class="chat" id="chat" aria-live="polite"></div></main>
<form class="composer" id="composer" style="bottom:44px">
  <textarea class="textarea" id="text" rows="1" placeholder="Write to support" aria-label="Message support" enterkeyhint="send" autocomplete="off" style="flex:1;min-width:0"></textarea>
  <button type="submit" class="btn btn-primary btn-icon" aria-label="Send"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m4 12 16-8-5 16-3-7z"/></svg></button>
</form>

<script src="../assets/i18n.js"></script>
<script src="../assets/app.js"></script>
<script>
  (function () {
    const { esc, icon, state } = BL;
    let thread = BL.qs("id") ? state.supportThreads.find((s) => s.id === BL.qs("id")) : null;
    const isNew = !thread && BL.qs("new");
    const bookingId = BL.qs("booking"); const booking = bookingId && BL.booking(bookingId);
    BL.ios.shell({ title: thread ? thread.subject : "New request", back: "support.html", backLabel: "Support", right: `<button class="btn btn-ghost btn-sm" id="more" aria-label="More">${icon("more")}</button>` });
    const top = document.getElementById("top"), chat = document.getElementById("chat"), form = document.getElementById("composer"), text = document.getElementById("text"), scroll = document.getElementById("content");
    if (!thread && !isNew) { top.innerHTML = `<div class="empty mt-10"><span class="tile">${icon("chat")}</span><h3>No conversation here</h3><a class="btn btn-primary btn-sm" href="support.html">Support</a></div>`; form.hidden = true; return; }

    let subject = BL.qs("subject") || (booking ? `About ${booking.title}` : "");
    function drawTop() {
      const b = thread ? BL.booking(thread.bookingId) : booking;
      top.innerHTML = `${isNew && !thread ? `<div class="field mb-4"><label class="label" for="subject">What is it about?</label><input class="input" id="subject" value="${esc(subject)}" placeholder="A booking, a refund, anything" autocomplete="off"></div>` : ""}
        ${b ? `<a class="row press group mb-4" href="booking.html?id=${b.id}" style="padding:4px 16px">${icon("calendar", "sm")}<span class="body"><span class="title block truncate">${esc(b.title)}</span><span class="sub">${b.code} · ${BL.bookingWhen(b)}</span></span>${icon("chevron-right", "sm chev")}</a>` : ""}
        ${thread ? `<div class="flex items-center justify-between mb-3"><span class="muted text-sm">${thread.status === "handed_off" ? "Dana from Dusk is on this" : thread.status === "resolved" ? "Resolved. Write again to reopen." : "The concierge answers in seconds"}</span>${BL.badge(thread.status)}</div>` : `<p class="muted text-sm mb-3">Tell us what happened. A person can step in at any point.</p>`}`;
    }
    const bubble = (m) => `<div class="bubble ${m.from === "user" ? "me" : "ai"}">${m.from === "agent" ? `<span class="text-caption muted block mb-1">Dana · Dusk</span>` : ""}<span>${esc(m.text)}</span><span class="time">${BL.ftime(m.at)}</span></div>`;
    function drawChat() { chat.innerHTML = thread ? thread.messages.map(bubble).join("") : ""; scroll.scrollTop = scroll.scrollHeight; }
    const typing = () => { const t = document.createElement("div"); t.className = "bubble ai typing"; t.innerHTML = "<i></i><i></i><i></i>"; chat.appendChild(t); scroll.scrollTop = scroll.scrollHeight; return t; };
    drawTop(); drawChat();

    let busy = false;
    function send(msg) {
      const t = (msg || "").trim(); if (!t || busy) return;
      if (!thread) {
        const subj = (document.getElementById("subject").value.trim() || t.slice(0, 40));
        thread = BL.supportNew(subj, t, bookingId); history.replaceState(null, "", `support-chat.html?id=${thread.id}`);
        document.querySelector(".nav-title").textContent = subj; document.title = `${subj} · Dusk`;
      } else BL.supportReply(thread.id, t);
      busy = true; text.value = ""; text.style.height = ""; drawTop(); drawChat();
      const tp = typing();
      setTimeout(() => { tp.remove(); BL.supportAuto(thread.id); drawTop(); drawChat(); busy = false; }, 900 + Math.random() * 500);
    }
    form.addEventListener("submit", (e) => { e.preventDefault(); send(text.value); });
    text.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(text.value); } });
    text.addEventListener("input", () => { text.style.height = ""; text.style.height = Math.min(120, text.scrollHeight) + "px"; });
    document.getElementById("more").addEventListener("click", () => {
      if (!thread) { BL.sheet({ title: "Options", body: `<p class="muted text-sm">Send a first message and you can hand the thread to a person or mark it resolved.</p>`, actions: [{ label: "OK", kind: "primary", onClick: (c) => c() }] }); return; }
      BL.sheet({ title: thread.subject, body: `<div class="kv"><dt>Status</dt><dd>${BL.statusLabel(thread.status)}</dd><dt>Messages</dt><dd>${thread.messages.length}</dd></div>`, actions: [
        ...(thread.status !== "handed_off" && thread.status !== "resolved" ? [{ label: "Talk to a person", kind: "secondary", onClick: (close) => { BL.supportHandoff(thread.id); close(); drawTop(); drawChat(); BL.toast("Dana has the thread"); } }] : []),
        ...(thread.status !== "resolved" ? [{ label: "Mark resolved", kind: "primary", onClick: (close) => { BL.supportResolve(thread.id); close(); drawTop(); BL.toast("Marked resolved"); } }] : []),
        { label: "Close" }] });
    });
    if (isNew) (document.getElementById("subject") || text).focus();
    if (booking && isNew && !text.value) text.placeholder = `Ask about ${booking.title}`;
  })();
</script>
</body>
</html>
