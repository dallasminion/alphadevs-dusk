<!doctype html>
<html lang="en" class="ios">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="mvp-screen" content="My Bookings / Wallet">
<title>Booking · Dusk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+Hebrew:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="../assets/tailwind.config.js"></script>
<link rel="stylesheet" href="../assets/theme.css">
</head>
<body class="ios">
<main class="scroll" id="content"><div id="view"></div></main>

<script src="../assets/i18n.js"></script>
<script src="../assets/app.js"></script>
<script>
  (function () {
    const { esc, icon, money, fdate, fstamp, state } = BL;
    const b = BL.booking(BL.qs("id"));
    BL.ios.shell({ title: b ? b.code : "Booking", back: "bookings.html", backLabel: "Bookings", tab: "bookings" });
    const view = document.getElementById("view");
    if (!b) { view.innerHTML = `<div class="empty mt-10"><span class="tile">${icon("calendar")}</span><h3>No booking here</h3><p>It may have been reset with the demo data.</p><a class="btn btn-primary btn-sm" href="bookings.html">Bookings</a></div>`; return; }

    function draw() {
      const pay = BL.payment(b.paymentId);
      const items = b.items.slice().sort((x, y) => (x.date + x.time).localeCompare(y.date + y.time));
      const live = BL.liveItems(b); const upcoming = BL.daysUntil(BL.firstDate(b)) >= 0;
      const canCancel = ["confirmed", "pending", "partial"].includes(b.status) && upcoming;
      const canCode = live.some((i) => i.status === "confirmed" || i.status === "redeemed");
      const canRate = (b.status === "completed" || !upcoming) && b.status !== "cancelled" && b.status !== "refunded" && !state.feedback.some((f) => f.bookingId === b.id);
      const declined = b.items.filter((i) => i.status === "declined");
      const alts = declined.length ? BL.alternativesFor(declined[0], declined[0].guests).slice(0, 3) : [];
      const toneOf = (s) => s === "confirmed" || s === "redeemed" ? "ok" : s === "pending" ? "wait" : "bad";
      view.innerHTML = `
        <h1 class="large-title">${esc(b.title)}<small>${BL.bookingWhen(b)} · ${BL.stops(b)} · ${b.source === "concierge" ? "Concierge plan" : "Booked directly"}</small></h1>
        <div class="flex items-center justify-between mb-5"><span class="num muted">${b.code}</span>${BL.badge(b.status)}</div>
        ${pay && pay.status === "pending" ? `<div class="wash p-4 mb-6"><p class="text-sm mb-3">${esc(pay.method)} is still verifying this payment. Vendors confirm once it clears.</p><button class="btn btn-primary btn-sm" id="settle">Simulate bank approval</button></div>` : ""}
        ${b.status === "cancelled" ? `<div class="wash p-4 mb-6 flex gap-3 items-start">${icon("info", "sm")}<p class="text-sm">Cancelled ${fstamp(b.cancelledAt)}. ${b.refund ? `${money(b.refund)} refunded to ${esc(pay ? pay.method : "your method")}.` : "Inside 24 hours, so no refund was due."}</p></div>` : ""}
        <div class="timeline mb-8 stagger">${items.map((it, i) => { const o = BL.offer(it.offerId), v = BL.vendor(it.vendorId); return `
          <div class="stop ${toneOf(it.status)}" style="--i:${i}">
            <div class="flex items-start justify-between gap-3">
              <div class="min-w-0 flex-1">
                <p class="muted text-sm num">${fdate(it.date)} · ${it.time}${o.duration ? ` · ${o.duration} min` : ""}</p>
                <a class="block font-medium truncate" href="offer.html?id=${o.id}">${esc(o.title)}</a>
                <a class="muted text-sm block truncate" href="vendor.html?id=${v.id}">${esc(v.name)} · ${esc(v.area)} · ${BL.plural(it.guests, "guest")}</a>
                ${it.declineReason ? `<p class="text-sm mt-1" style="color:var(--bad)">${esc(it.declineReason)}${it.refunded ? ` · ${money(it.refunded)} refunded` : ""}</p>` : ""}
                ${it.status === "redeemed" ? `<p class="text-sm mt-1 muted">Redeemed ${fstamp(it.redeemedAt)}</p>` : ""}
                ${it.editedBy ? `<p class="text-sm mt-1 muted">Adjusted by Dusk</p>` : ""}
                ${it.voucher ? `<p class="text-sm mt-1 muted num">${v.category === "Stays" ? "Voucher" : "Pass"} ${it.voucher} · in your wallet</p>` : ""}
              </div>
              <div class="flex flex-col items-end gap-1" style="flex:none"><span class="num">${money(it.price)}</span>${BL.badge(it.status)}</div>
            </div>
          </div>`; }).join("")}</div>
        ${alts.length ? `<section class="section"><div class="section-title"><h2>Available instead</h2></div><div class="group">${alts.map((o) => { const v = BL.vendor(o.vendorId); return `<a class="row press" href="offer.html?id=${o.id}"><span class="body"><span class="title block truncate">${esc(o.title)}</span><span class="sub block truncate">${esc(v.name)} · ${esc(v.area)}</span></span><span class="right num">${money(BL.itemPrice(o, declined[0].guests))}</span>${icon("chevron-right", "sm chev")}</a>`; }).join("")}</div></section>` : ""}
        <section class="section">
          <div class="section-title"><h2>Payment</h2></div>
          ${pay ? `<div class="kv"><dt>Charged to</dt><dd>${esc(pay.method)}</dd><dt>Amount</dt><dd>${money(pay.amount)}</dd>${pay.refundAmount ? `<dt>Refunded</dt><dd>${money(pay.refundAmount)}</dd>` : ""}<dt>Status</dt><dd>${BL.badge(pay.status)}</dd><dt>When</dt><dd>${fstamp(pay.at)}</dd></div>` : `<p class="muted text-sm">No payment on record.</p>`}
        </section>
        <section class="section">
          <div class="group">
            ${canCode ? `<button class="row press" id="code">${icon("qr", "sm")}<span class="body"><span class="title">Show code at the door</span><span class="sub">One code for every stop</span></span>${icon("chevron-right", "sm chev")}</button>` : ""}
            <a class="row press" href="support-chat.html?new=1&booking=${b.id}">${icon("headset", "sm")}<span class="body"><span class="title">Message support</span><span class="sub">Move a stop, ask about a refund</span></span>${icon("chevron-right", "sm chev")}</a>
            ${canRate ? `<a class="row press" href="feedback.html?booking=${b.id}">${icon("star", "sm")}<span class="body"><span class="title">Rate this booking</span><span class="sub">Earns 50 points</span></span>${icon("chevron-right", "sm chev")}</a>` : ""}
            ${canCancel ? `<button class="row press" id="cancel">${icon("x-circle", "sm")}<span class="body"><span class="title" style="color:var(--bad)">Cancel booking</span><span class="sub">${BL.daysUntil(BL.firstDate(b)) >= 1 ? "Full refund, more than 24 h away" : "Inside 24 h, no refund"}</span></span></button>` : ""}
          </div>
        </section>`;
    }
    draw();
    BL.on(view, "click", "#settle", async () => {
      BL.settlePending(b.paymentId); BL.toast("Payment cleared");
      for (const it of b.items.filter((i) => i.status === "pending")) { await new Promise((r) => setTimeout(r, 500)); BL.vendorDecide(b.id, it.offerId, "confirm"); BL.toast(`${BL.vendor(it.vendorId).name} confirmed`); draw(); }
      draw();
    });
    BL.on(view, "click", "#code", () => {
      BL.sheet({ title: "Show this at the door", body: `<div class="flex flex-col items-center gap-3 py-2">${BL.qr(b.code)}<p class="num" style="font-size:22px;letter-spacing:.08em">${b.code}</p><p class="muted text-sm text-center">The vendor scans or types it. It covers every confirmed stop in this booking.</p></div>`, actions: [{ label: "Copy code", kind: "secondary", onClick: (close) => { try { navigator.clipboard && navigator.clipboard.writeText(b.code); } catch (e) {} BL.toast("Code copied"); } }, { label: "Done", kind: "primary", onClick: (close) => close() }] });
    });
    BL.on(view, "click", "#cancel", async () => {
      const full = BL.daysUntil(BL.firstDate(b)) >= 1; const amount = b.items.filter((i) => i.status === "confirmed" || i.status === "pending").reduce((s, i) => s + i.price, 0);
      if (!(await BL.confirm({ title: "Cancel this booking?", body: full ? `Every vendor is told and ${money(amount)} goes back to your payment method.` : `The first stop is less than 24 hours away, so the ${money(amount)} is not refunded.`, ok: "Cancel booking", cancel: "Keep it", danger: true }))) return;
      const r = BL.cancelBooking(b.id);
      BL.toast(r.refund ? `Cancelled, ${money(r.refund)} refunded` : "Cancelled");
      draw(); document.getElementById("content").scrollTop = 0;
    });
  })();
</script>
</body>
</html>
