<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0a0a">
<meta name="mvp-screen" content="Back Office">
<title>Booking · Blissers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+Hebrew:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="../assets/tailwind.config.js"></script>
<link rel="stylesheet" href="../assets/theme.css">
</head>
<body>
<div class="web-shell">
<main class="web-main">
<div class="page" id="content"><div id="view"></div></div>
</main>
</div>
<script src="../assets/i18n.js"></script>
<script src="../assets/app.js"></script>
<script>
  (function () {
    const { esc, icon, money, fdate, fstamp, state } = BL;
    const b = BL.booking(BL.qs("id"));
    BL.web.shell({ title: b ? b.code : "Booking", role: "admin", active: "bookings" });
    const view = document.getElementById("view");
    if (!b) { view.innerHTML = `<div class="empty panel"><span class="tile">${icon("calendar")}</span><h3>No such booking</h3><a class="btn btn-primary btn-sm" href="admin-bookings.html">All bookings</a></div>`; return; }
    const TONE = { confirmed: "ok", redeemed: "ok", pending: "wait", declined: "bad", cancelled: "bad" };
    function draw() {
      const u = BL.user(b.userId); const pay = BL.payment(b.paymentId); const thread = state.supportThreads.find((s) => s.bookingId === b.id);
      const editable = (i) => i.status === "pending";
      const refunded = b.items.reduce((s, i) => s + (i.refunded || 0), 0);
      view.innerHTML = `
        <div class="crumbs"><a href="admin-bookings.html">Bookings</a>${icon("chevron-right", "sm")}<span>${b.code}</span></div>
        <div class="page-head"><div class="min-w-0"><h1 class="truncate">${esc(b.title)}</h1><p><span class="num">${b.code}</span> · ${b.source === "concierge" ? "planned by the concierge" : "booked direct"} · ${fstamp(b.createdAt)}</p></div><div class="flex items-center gap-2 flex-wrap">${BL.badge(b.status)}${["confirmed", "pending", "partial"].includes(b.status) ? `<button class="btn btn-secondary" id="cancel">Cancel booking</button>` : ""}<a class="btn btn-secondary" href="../ios/booking.html?id=${b.id}">Member view</a></div></div>
        ${b.status === "partial" ? `<div class="panel p-4 mb-6 flex gap-3 items-start">${icon("alert", "sm")}<p class="text-sm">One stop fell through. The member has been refunded for it; you can add a replacement from the catalogue or leave the plan as it stands.</p></div>` : ""}
        ${pay && pay.status === "pending" ? `<div class="panel p-4 mb-6 flex flex-wrap gap-3 items-center">${icon("clock", "sm")}<p class="text-sm flex-1">The ${money(pay.amount)} charge is still pending at the bank. Vendors are not asked to confirm until it clears.</p><a class="btn btn-secondary btn-sm" href="admin-payment.html?id=${pay.id}">Open payment</a></div>` : pay && pay.status === "failed" ? `<div class="panel p-4 mb-6 flex flex-wrap gap-3 items-center">${icon("ban", "sm")}<p class="text-sm flex-1">The charge failed: ${esc(pay.failReason || "card declined")}. Nothing was sent to the vendors.</p><a class="btn btn-secondary btn-sm" href="admin-payment.html?id=${pay.id}">Open payment</a></div>` : ""}
        <div class="split">
          <div>
            <section class="section"><div class="section-title"><h2>${BL.plural(b.items.length, "stop")}</h2>${["confirmed", "pending", "partial"].includes(b.status) ? `<button class="btn btn-ghost btn-sm" id="add">Add a stop</button>` : ""}</div>
              <div class="card"><div class="timeline stagger">${b.items.map((i, idx) => { const o = BL.offer(i.offerId), v = BL.vendor(i.vendorId); return `
                <div class="stop ${TONE[i.status] || ""}" style="--i:${idx}">
                  <div class="flex items-start justify-between gap-3 flex-wrap"><div class="min-w-0"><div class="font-medium truncate">${esc(o.title)}</div><div class="text-sm muted truncate"><a href="admin-vendor.html?id=${v.id}">${esc(v.name)}</a> · ${fdate(i.date)} at ${i.time} · ${BL.plural(i.guests, "guest")}</div>${i.declineReason ? `<div class="text-sm muted mt-1">${i.status === "declined" ? "Declined" : "Cancelled"}: ${esc(i.declineReason)}${i.refunded ? ` · ${money(i.refunded)} refunded` : ""}</div>` : ""}${i.editedBy === "admin" ? `<div class="text-sm muted mt-1">Adjusted by Blissers</div>` : ""}${i.redeemedAt ? `<div class="text-sm muted mt-1">Redeemed ${fstamp(i.redeemedAt)}</div>` : ""}</div><div class="text-right flex-none"><div class="num">${money(i.price)}</div>${BL.badge(i.status)}</div></div>
                  ${editable(i) ? `<div class="flex gap-2 mt-3 flex-wrap"><button class="btn btn-secondary btn-sm" data-ok="${idx}">Confirm for vendor</button><button class="btn btn-secondary btn-sm" data-edit="${idx}">Edit</button><button class="btn btn-ghost btn-sm" data-rm="${idx}">Remove</button></div>` : i.status === "confirmed" && BL.daysUntil(i.date) >= 0 ? `<div class="flex gap-2 mt-3"><button class="btn btn-ghost btn-sm" data-rm="${idx}">Remove and refund</button></div>` : ""}
                </div>`; }).join("")}</div>
                <div class="flex justify-between items-baseline pt-4 mt-2" style="border-top:1px solid var(--hair)"><span class="text-sm muted">${refunded ? `${money(refunded)} refunded · ` : ""}Total charged</span><span class="text-lg font-medium num">${money(b.total)}</span></div>
              </div>
            </section>
          </div>
          <div>
            <section class="section"><div class="section-title"><h2>Member</h2></div><div class="card"><div class="flex items-center gap-3 mb-4"><span class="avatar">${BL.initials(u.name)}</span><div class="min-w-0"><a class="font-medium block truncate" href="admin-user.html?id=${u.id}">${esc(u.name)}</a><div class="text-sm muted">${esc(u.plan)} member · ${BL.plural(BL.userStats(u.id).bookings, "booking")}</div></div></div><div class="kv"><dt>Phone</dt><dd>${u.phone ? `<a href="tel:${esc(u.phone.replace(/\s/g, ""))}">${esc(u.phone)}</a>` : "—"}</dd></div><div class="kv"><dt>Email</dt><dd><a href="mailto:${esc(u.email)}">${esc(u.email)}</a></dd></div></div></section>
            <section class="section"><div class="section-title"><h2>Payment</h2>${pay ? `<a href="admin-payment.html?id=${pay.id}">Open</a>` : ""}</div>${pay ? `<div class="card"><div class="kv"><dt>Amount</dt><dd class="num">${money(pay.amount)}</dd></div><div class="kv"><dt>Method</dt><dd>${esc(pay.method)}</dd></div><div class="kv"><dt>Status</dt><dd>${BL.badge(pay.status)}</dd></div>${pay.refundAmount ? `<div class="kv"><dt>Refunded</dt><dd class="num">${money(pay.refundAmount)}</dd></div>` : ""}<div class="kv"><dt>Taken</dt><dd>${fstamp(pay.at)}</dd></div></div>` : `<div class="empty panel"><span class="tile">${icon("card")}</span><h3>No payment</h3><p>Nothing has been charged for this plan.</p></div>`}</section>
            <section class="section"><div class="section-title"><h2>Support</h2></div>${thread ? `<a class="card block press" href="../ios/support-chat.html?id=${thread.id}"><div class="flex items-center justify-between gap-3"><div class="min-w-0"><div class="font-medium truncate">${esc(thread.subject)}</div><div class="text-sm muted">${fstamp(thread.updatedAt)}</div></div>${BL.badge(thread.status)}</div></a>` : `<div class="empty panel"><span class="tile">${icon("headset")}</span><h3>No thread</h3><p>The member has not asked about this booking.</p></div>`}</section>
          </div>
        </div>`;
    }
    draw();
    BL.on(view, "click", "[data-ok]", (e, el) => { const i = b.items[+el.dataset.ok]; BL.vendorDecide(b.id, i.offerId, "confirm"); state.log.unshift({ at: BL.nowIso(), text: `Admin confirmed ${BL.offer(i.offerId).title} on ${b.code}` }); BL.save(); BL.toast("Confirmed on the vendor’s behalf"); draw(); });
    BL.on(view, "click", "[data-edit]", (e, el) => {
      const idx = +el.dataset.edit, i = b.items[idx], o = BL.offer(i.offerId);
      BL.dialog({ title: `Edit ${esc(o.title)}`, body: `<form id="ef" class="grid grid-cols-1 md:grid-cols-3 gap-3" novalidate><div class="field"><label class="label" for="pr">Price</label><input class="input num" id="pr" name="price" type="number" inputmode="numeric" min="0" step="1" value="${i.price}"><p class="error">0 or more.</p></div><div class="field"><label class="label" for="dt">Date</label><input class="input num" id="dt" name="date" type="date" value="${i.date}" min="${BL.day(0)}"><p class="error">Not in the past.</p></div><div class="field"><label class="label" for="tm">Time</label><input class="input num" id="tm" name="time" type="time" value="${i.time}"></div></form><p class="help mt-3">The member sees the new price and time on their plan. A lower price is refunded to their card when the vendor confirms.</p>`,
        actions: [{ label: "Cancel" }, { label: "Save", kind: "primary", onClick: (close, host) => { const f = host.querySelector("#ef"); f.querySelectorAll(".field").forEach((x) => x.classList.remove("is-invalid")); let bad = false; if (!(Number(f.price.value) >= 0)) { f.price.closest(".field").classList.add("is-invalid"); bad = true; } if (!f.date.value || f.date.value < BL.day(0)) { f.date.closest(".field").classList.add("is-invalid"); bad = true; } if (bad) return; BL.adminEditItem(b.id, idx, { price: Number(f.price.value), date: f.date.value, time: f.time.value || i.time }); close(); BL.toast("Stop updated"); draw(); } }] });
    });
    BL.on(view, "click", "[data-rm]", (e, el) => {
      const idx = +el.dataset.rm, i = b.items[idx], o = BL.offer(i.offerId);
      BL.dialog({ title: `Remove ${esc(o.title)}?`, body: `<p class="text-sm muted mb-4">${money(i.price)} goes back to the member and the vendor is told. The rest of the plan stays.</p><div class="field"><label class="label" for="why">Reason the member sees</label><select class="select" id="why"><option>Vendor could not honour the slot</option><option>Member asked for a change</option><option>Venue closed that day</option><option>Duplicate stop</option></select></div>`,
        actions: [{ label: "Keep it" }, { label: "Remove and refund", kind: "danger", onClick: (close, host) => { BL.adminEditItem(b.id, idx, { remove: true, reason: host.querySelector("#why").value }); close(); BL.toast(`Removed, ${money(i.price)} refunded`); draw(); } }] });
    });
    BL.on(view, "click", "#add", () => {
      const date = BL.firstDate(b); const guests = b.items[0] ? b.items[0].guests : 2;
      const opts = state.offers.filter((o) => o.status === "active" && BL.vendor(o.vendorId).status === "active" && !b.items.some((i) => i.offerId === o.id && i.status !== "declined"));
      BL.dialog({ title: "Add a stop", body: `<form id="af" class="grid grid-cols-1 md:grid-cols-2 gap-3" novalidate><div class="field md:col-span-2"><label class="label" for="of">Offer</label><select class="select" id="of">${opts.map((o) => `<option value="${o.id}">${esc(o.title)} · ${esc(BL.vendor(o.vendorId).name)} · ${money(o.price)} ${esc(o.unit)}</option>`).join("")}</select></div><div class="field"><label class="label" for="dt">Date</label><input class="input num" id="dt" type="date" value="${date}" min="${BL.day(0)}"></div><div class="field"><label class="label" for="tm">Time</label><input class="input num" id="tm" type="time" value="19:00"></div></form><p class="help mt-3">The member is charged ${esc(BL.plural(guests, "guest"))} at the offer price once the vendor confirms. It appears on their plan straight away as awaiting the vendor.</p>`,
        actions: [{ label: "Cancel" }, { label: "Add stop", kind: "primary", onClick: (close, host) => { const o = BL.offer(host.querySelector("#of").value); if (!o) return; const price = o.unit === "per person" ? o.price * guests : o.price; b.items.push({ offerId: o.id, vendorId: o.vendorId, date: host.querySelector("#dt").value || date, time: host.querySelector("#tm").value || "19:00", guests, price, status: "pending", editedBy: "admin" }); b.total = b.items.reduce((s, i) => s + i.price, 0); const pay = BL.payment(b.paymentId); if (pay) pay.amount = b.total; BL.recomputeBooking(b); state.log.unshift({ at: BL.nowIso(), text: `Admin added ${o.title} to ${b.code}` }); BL.save(); close(); BL.toast("Stop added, vendor asked to confirm"); draw(); } }] });
    });
    BL.on(view, "click", "#cancel", async () => { if (!(await BL.confirm({ title: `Cancel ${b.code}?`, body: "Every stop is cancelled and the member is refunded what the policy allows. Vendors are told.", ok: "Cancel booking", cancel: "Keep it", danger: true }))) return; const r = BL.cancelBooking(b.id); state.log.unshift({ at: BL.nowIso(), text: `Admin cancelled ${b.code}` }); BL.save(); BL.toast(r && r.refund ? `Cancelled, ${money(r.refund)} refunded` : "Cancelled"); draw(); });
  })();
</script>
</body>
</html>
