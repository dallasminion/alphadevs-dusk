<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0a0a">
<meta name="mvp-screen" content="Back Office">
<title>Bookings · Dusk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+Hebrew:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="../assets/tailwind.config.js"></script>
<link rel="stylesheet" href="../assets/theme.css">
</head>
<body>
<div class="web-shell">
<main class="web-main">
<div class="page" id="content">
  <div class="page-head"><div><h1>Bookings</h1><p id="sub"></p></div></div>
  <div class="toolbar">
    <select class="select" id="status" aria-label="Status"><option value="">Every status</option><option value="pending">Awaiting vendor</option><option value="partial">Partly confirmed</option><option value="confirmed">Confirmed</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option><option value="refunded">Refunded</option></select>
    <select class="select" id="source" aria-label="Source"><option value="">Any source</option><option value="concierge">Concierge plan</option><option value="direct">Booked direct</option></select>
    <select class="select" id="when" aria-label="When"><option value="">Any date</option><option value="today">Today</option><option value="upcoming">Upcoming</option><option value="past">Past</option></select>
    <div class="input-wrap ml-auto" id="qwrap"></div>
  </div>
  <div id="table"></div>
</div>
</main>
</div>
<script src="../assets/i18n.js"></script>
<script src="../assets/app.js"></script>
<script>
  (function () {
    const { esc, icon, money, fdate, state } = BL;
    BL.web.shell({ title: "Bookings", role: "admin", active: "bookings", onSearch: (s) => { q.value = s; redraw(); } });
    document.getElementById("qwrap").innerHTML = `${icon("search", "sm")}<input class="input" type="search" id="q" placeholder="Code, member or vendor" aria-label="Filter bookings" autocomplete="off">`;
    const q = document.getElementById("q"), status = document.getElementById("status"), source = document.getElementById("source"), when = document.getElementById("when");
    if (BL.qs("status")) status.value = BL.qs("status"); if (BL.qs("q")) q.value = BL.qs("q");
    const first = (b) => BL.firstDate(b);
    const vendors = (b) => [...new Set(b.items.map((i) => BL.vendor(i.vendorId).name))];
    const rows = () => { const s = q.value.trim().toLowerCase(); return state.bookings.filter((b) => { const d = BL.daysUntil(first(b)); return (!status.value || b.status === status.value) && (!source.value || b.source === source.value) && (!when.value || (when.value === "today" ? d === 0 : when.value === "upcoming" ? d > 0 : d < 0)) && (!s || `${b.code} ${b.title} ${BL.user(b.userId).name} ${vendors(b).join(" ")}`.toLowerCase().includes(s)); }); };
    const sub = () => { document.getElementById("sub").textContent = `${BL.plural(state.bookings.filter((b) => b.status === "pending" || b.status === "partial").length, "booking")} still waiting on a vendor`; };
    const t = BL.webTable(document.getElementById("table"), { rows, sort: "createdAt", dir: "desc", href: (b) => `admin-booking.html?id=${b.id}`, pageSize: 12,
      cols: [{ key: "code", label: "Code", render: (b) => `<span class="num">${b.code}</span>` }, { key: "member", label: "Member", sort: (b) => BL.user(b.userId).name, render: (b) => `<span class="truncate">${esc(BL.user(b.userId).name)}</span>` }, { key: "title", label: "Plan", render: (b) => `<span class="truncate">${esc(b.title)}</span>` }, { key: "when", label: "When", sort: first, render: (b) => `${fdate(first(b))} · ${b.items.map((i) => i.time).sort()[0]}` }, { key: "stops", label: "Stops", num: true, sort: (b) => b.items.length, render: (b) => b.items.length }, { key: "total", label: "Total", num: true, render: (b) => money(b.total) }, { key: "status", label: "Status", render: (b) => BL.badge(b.status) }],
      card: (b) => ({ title: `${b.code} · ${esc(BL.user(b.userId).name)}`, meta: `${esc(b.title)} · ${fdate(first(b))} · ${money(b.total)}`, right: BL.badge(b.status) }),
      empty: `<div class="empty panel"><span class="tile">${icon("calendar")}</span><h3>No bookings match</h3><p>Clear a filter to see the rest.</p><button class="btn btn-secondary btn-sm" id="clear">Clear filters</button></div>` });
    sub();
    const redraw = () => { t.state.page = 0; t.draw(); };
    [status, source, when].forEach((el) => el.addEventListener("change", redraw)); q.addEventListener("input", redraw);
    BL.on(document.getElementById("table"), "click", "#clear", () => { status.value = ""; source.value = ""; when.value = ""; q.value = ""; redraw(); });
  })();
</script>
</body>
</html>
