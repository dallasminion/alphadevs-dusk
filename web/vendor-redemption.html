<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0a0a">
<meta name="mvp-screen" content="Vendor Portal">
<title>Redemption · Blissers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+Hebrew:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="../assets/tailwind.config.js"></script>
<link rel="stylesheet" href="../assets/theme.css">
</head>
<body>
<div class="web-shell">
<main class="web-main">
<div class="page" id="content">
  <div class="page-head"><div><h1>Redeem a booking</h1><p>Type or scan the code the guest shows. Each stop redeems once.</p></div></div>
  <div class="split">
    <div>
      <form class="card pad-lg mb-6" id="form" novalidate>
        <div class="field mb-4"><label class="label" for="code">Booking code</label><input class="input num" id="code" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="BLS-0000" style="font-size:22px;letter-spacing:.08em"><p class="help">Codes look like BLS-7F3K.</p></div>
        <button type="submit" class="btn btn-primary btn-lg btn-block">Redeem</button>
      </form>
      <div id="result"></div>
    </div>
    <div>
      <div class="grid grid-cols-2 gap-4 mb-6" id="stats"></div>
      <section class="section"><div class="section-title"><h2>Redeemed recently</h2></div><div id="recent"></div></section>
    </div>
  </div>
</div>
</main>
</div>
<script src="../assets/i18n.js"></script>
<script src="../assets/app.js"></script>
<script>
  (function () {
    const { esc, icon, money, fdate, fstamp, state } = BL;
    const vid = state.session.vendorId; const v = BL.vendor(vid);
    BL.web.shell({ title: "Redemption", role: "vendor", active: "redemption" });
    const today = BL.day(0);
    function drawSide() {
      const items = BL.bookingsForVendor(vid).flatMap(({ booking, items }) => items.map((it) => ({ booking, it })));
      const done = items.filter((x) => x.it.status === "redeemed").sort((a, b) => (b.it.redeemedAt || "").localeCompare(a.it.redeemedAt || ""));
      const expected = items.filter((x) => x.it.date === today && x.it.status === "confirmed");
      document.getElementById("stats").innerHTML = `<div class="stat panel p-4"><span class="value">${done.filter((x) => (x.it.redeemedAt || "").slice(0, 10) === today).reduce((s, x) => s + x.it.guests, 0)}</span><span class="label muted">Guests in today</span></div><div class="stat panel p-4"><span class="value">${expected.reduce((s, x) => s + x.it.guests, 0)}</span><span class="label muted">Still expected today</span></div>`;
      BL.render(document.getElementById("recent"), done.length ? `<div class="panel px-4 stagger">${done.slice(0, 8).map(({ booking, it }, i) => { const u = BL.user(booking.userId); const o = BL.offer(it.offerId); return `<a class="row press" href="vendor-booking.html?id=${booking.id}" style="--i:${i}"><span class="tile" style="color:var(--ok)">${icon("check", "sm")}</span><span class="body"><span class="title block truncate">${esc(u ? u.name : "Guest")} · ${BL.plural(it.guests, "guest")}</span><span class="sub block truncate">${esc(o.title)} · ${booking.code}</span></span><span class="right muted text-sm">${fstamp(it.redeemedAt)}</span></a>`; }).join("")}</div>` : `<div class="empty panel"><span class="tile">${icon("qr")}</span><h3>Nothing redeemed yet</h3><p>The first code you redeem lands here.</p></div>`);
    }
    drawSide();
    const input = document.getElementById("code"); const res = document.getElementById("result");
    if (BL.qs("code")) input.value = BL.qs("code").toUpperCase();
    input.focus();
    input.addEventListener("input", () => { input.value = input.value.toUpperCase(); });
    document.getElementById("form").addEventListener("submit", (ev) => {
      ev.preventDefault(); const code = input.value.trim().toUpperCase();
      if (!code) { input.closest(".field").classList.add("is-invalid"); input.focus(); return; }
      input.closest(".field").classList.remove("is-invalid");
      const r = BL.redeemCode(code, vid);
      if (r.ok) { const u = BL.user(r.booking.userId); const o = BL.offer(r.item.offerId); res.innerHTML = `<div class="card enter" style="border-color:var(--ok)"><div class="flex items-center gap-3"><span class="tile success-ring" style="color:var(--ok)">${icon("check")}</span><div class="min-w-0 flex-1"><p class="font-medium">Welcome, ${esc(u ? u.name.split(" ")[0] : "guest")}</p><p class="muted text-sm">${esc(o.title)} · ${BL.plural(r.item.guests, "guest")} · ${fdate(r.item.date)} at ${r.item.time}</p></div><a class="btn btn-ghost btn-sm" href="vendor-booking.html?id=${r.booking.id}">Open</a></div></div>`; BL.toast("Redeemed"); }
      else { res.innerHTML = `<div class="card enter" style="border-color:var(--bad)"><div class="flex items-center gap-3"><span class="tile" style="color:var(--bad)">${icon("x")}</span><div class="min-w-0 flex-1"><p class="font-medium">Not redeemed</p><p class="muted text-sm">${esc(r.reason)} · ${code}</p></div>${r.booking && r.item ? `<a class="btn btn-ghost btn-sm" href="vendor-booking.html?id=${r.booking.id}">Open</a>` : ""}</div></div>`; }
      input.value = ""; input.focus(); drawSide();
    });
  })();
</script>
</body>
</html>
