<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0a0a">
<meta name="mvp-screen" content="Vendor Portal">
<title>Offers · Blissers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+Hebrew:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="../assets/tailwind.config.js"></script>
<link rel="stylesheet" href="../assets/theme.css">
</head>
<body>
<div class="web-shell">
<main class="web-main">
<div class="page" id="content">
  <div class="page-head"><div><h1>Offers</h1><p id="sub"></p></div><button class="btn btn-primary" id="new">New offer</button></div>
  <div class="toolbar">
    <select class="select" id="status" aria-label="Status"><option value="">Every status</option><option value="active">Active</option><option value="paused">Paused</option><option value="draft">Draft</option></select>
    <div class="input-wrap ml-auto" id="qwrap"></div>
  </div>
  <div id="table"></div>
</div>
</main>
</div>
<script src="../assets/i18n.js"></script>
<script src="../assets/app.js"></script>
<script>
  (function () {
    const { esc, icon, money, fdate, state } = BL;
    const vid = state.session.vendorId; const v = BL.vendor(vid);
    BL.web.shell({ title: "Offers", role: "vendor", active: "offers", onSearch: (q) => { document.getElementById("q").value = q; t.draw(); } });
    document.getElementById("qwrap").innerHTML = `${icon("search", "sm")}<input class="input" type="search" id="q" placeholder="Filter offers" aria-label="Filter offers" autocomplete="off">`;
    const mine = () => state.offers.filter((o) => o.vendorId === vid);
    const bookingsOf = (o) => state.bookings.reduce((n, b) => n + b.items.filter((i) => i.offerId === o.id && i.status !== "declined" && i.status !== "cancelled").length, 0);
    const sub = () => { document.getElementById("sub").textContent = `${BL.plural(mine().filter((o) => o.status === "active").length, "live offer")}${v.status === "pending" ? " · drafts go live once Blissers approves you" : ""}`; };
    const rows = () => { const q = document.getElementById("q").value.trim().toLowerCase(); const s = document.getElementById("status").value; return mine().filter((o) => (!s || o.status === s) && (!q || `${o.title} ${o.tags.join(" ")}`.toLowerCase().includes(q))); };
    const t = BL.webTable(document.getElementById("table"), { rows, sort: "title", href: (o) => `vendor-offers.html?edit=${o.id}`, pageSize: 10,
      cols: [{ key: "title", label: "Offer", render: (o) => `<span class="truncate">${esc(o.title)}</span>` }, { key: "price", label: "Price", num: true, render: (o) => `${money(o.price)} <span class="muted">${esc(o.unit)}</span>` }, { key: "duration", label: "Length", num: true, render: (o) => o.duration ? `${o.duration} min` : "—" }, { key: "tags", label: "Tags", sort: (o) => o.tags.join(","), render: (o) => o.tags.map((x) => `<span class="tag">${esc(x)}</span>`).join(" ") }, { key: "bookings", label: "Bookings", num: true, sort: bookingsOf, render: (o) => bookingsOf(o) }, { key: "status", label: "Status", render: (o) => BL.badge(o.status) }],
      card: (o) => ({ title: esc(o.title), meta: `${money(o.price)} ${esc(o.unit)} · ${o.duration ? `${o.duration} min` : "No set length"} · ${BL.plural(bookingsOf(o), "booking")}`, right: BL.badge(o.status) }),
      empty: `<div class="empty panel"><span class="tile">${icon("tag")}</span><h3>No offers here</h3><p>An offer is something the concierge can book: a table, a treatment, a sail.</p><button class="btn btn-secondary btn-sm" id="new2">New offer</button></div>` });
    sub();
    document.getElementById("q").addEventListener("input", () => { t.state.page = 0; t.draw(); });
    document.getElementById("status").addEventListener("change", () => { t.state.page = 0; t.draw(); });
    function edit(o) {
      const isNew = !o; o = o || { title: "", price: 0, unit: "per person", duration: 60, status: v.status === "active" ? "active" : "draft", tags: [], description: "" };
      const units = ["per person", "per couple", "per group", "per night"];
      BL.dialog({ title: isNew ? "New offer" : "Edit offer", wide: true, body: `<form id="of" class="grid grid-cols-1 md:grid-cols-2 gap-4" novalidate>
          <div class="field md:col-span-2"><label class="label" for="title">Name</label><input class="input" id="title" name="title" value="${esc(o.title)}" placeholder="Tasting menu for two" autocomplete="off"><p class="error">Give the offer a name.</p></div>
          <div class="field"><label class="label" for="price">Price</label><input class="input num" id="price" name="price" type="number" inputmode="numeric" min="0" step="10" value="${o.price}"><p class="error">A price of ₪0 or more.</p></div>
          <div class="field"><label class="label" for="unit">Priced</label><select class="select" id="unit" name="unit">${units.map((u) => `<option ${u === o.unit ? "selected" : ""}>${u}</option>`).join("")}</select></div>
          <div class="field"><label class="label" for="dur">Length, minutes</label><input class="input num" id="dur" name="duration" type="number" inputmode="numeric" min="0" step="15" value="${o.duration}"><p class="help">0 for an add-on with no set length.</p></div>
          <div class="field"><label class="label" for="st">Status</label><select class="select" id="st" name="status"><option value="active" ${o.status === "active" ? "selected" : ""} ${v.status !== "active" ? "disabled" : ""}>Active</option><option value="paused" ${o.status === "paused" ? "selected" : ""}>Paused</option><option value="draft" ${o.status === "draft" ? "selected" : ""}>Draft</option></select>${v.status !== "active" ? `<p class="help">Offers go live once Blissers approves your listing.</p>` : ""}</div>
          <div class="field md:col-span-2"><label class="label" for="tags">Tags</label><input class="input" id="tags" name="tags" value="${esc(o.tags.join(", "))}" placeholder="Evening, Date night" autocomplete="off"><p class="help">Comma-separated. Members see them on the card.</p></div>
          <div class="field md:col-span-2"><label class="label" for="desc">Description</label><textarea class="textarea" id="desc" name="description" rows="3">${esc(o.description)}</textarea></div>
        </form>`,
        actions: [{ label: "Cancel" }, { label: isNew ? "Create offer" : "Save changes", kind: "primary", onClick: (close, host) => {
          const f = host.querySelector("#of"); let bad = false; f.querySelectorAll(".field").forEach((x) => x.classList.remove("is-invalid"));
          if (!f.title.value.trim()) { f.title.closest(".field").classList.add("is-invalid"); bad = true; }
          if (!(Number(f.price.value) >= 0)) { f.price.closest(".field").classList.add("is-invalid"); bad = true; }
          if (bad) return;
          BL.saveOffer({ id: o.id, vendorId: vid, title: f.title.value.trim(), price: Number(f.price.value), unit: f.unit.value, duration: Number(f.duration.value) || 0, status: f.status.value, tags: f.tags.value.split(",").map((x) => x.trim()).filter(Boolean), description: f.description.value.trim() });
          close(); BL.toast(isNew ? "Offer created" : "Offer saved"); sub(); t.draw();
        } }] });
    }
    document.getElementById("new").addEventListener("click", () => edit(null));
    BL.on(document.getElementById("table"), "click", "#new2", () => edit(null));
    if (BL.qs("edit")) { const o = BL.offer(BL.qs("edit")); if (o && o.vendorId === vid) edit(o); history.replaceState(null, "", "vendor-offers.html"); }
  })();
</script>
</body>
</html>
