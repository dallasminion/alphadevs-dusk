<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0a0a">
<meta name="mvp-screen" content="Back Office">
<title>Back office · Dusk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+Hebrew:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="../assets/tailwind.config.js"></script>
<link rel="stylesheet" href="../assets/theme.css">
</head>
<body>
<div class="web-shell">
<main class="web-main">
<div class="page" id="content"><div id="view"></div></div>
</main>
</div>
<script src="../assets/i18n.js"></script>
<script src="../assets/app.js"></script>
<script>
  (function () {
    const { esc, icon, money, fdate, fstamp, state } = BL;
    BL.web.shell({ title: "Back office", role: "admin", active: "dashboard" });
    const view = document.getElementById("view");
    const rep = BL.reportTotals();
    const pendingVendors = state.vendors.filter((v) => v.status === "pending");
    const failed = state.payments.filter((p) => p.status === "failed");
    const partial = state.bookings.filter((b) => b.status === "partial");
    const openSupport = state.supportThreads.filter((s) => s.status !== "resolved").sort((a, b) => b.updatedAt.localeCompare(a.updatedAt));
    const live = state.bookings.filter((b) => !["cancelled", "refunded"].includes(b.status));
    const attention = [
      ...pendingVendors.map((v) => ({ icon: "store", title: `${v.name} is waiting for review`, sub: `${v.category} · applied ${fdate(v.joined)}`, href: `admin-vendor.html?id=${v.id}`, cta: "Review" })),
      ...partial.map((b) => ({ icon: "alert", title: `${b.code} is only partly confirmed`, sub: `${BL.user(b.userId).name} · ${b.title}`, href: `admin-booking.html?id=${b.id}`, cta: "Open" })),
      ...failed.map((p) => ({ icon: "card", title: `Payment ${p.id} failed`, sub: `${BL.user(p.userId).name} · ${money(p.amount)} · ${p.failReason || "Card declined"}`, href: `admin-payment.html?id=${p.id}`, cta: "Open" })),
      ...state.supportThreads.filter((s) => s.status === "handed_off").map((s) => ({ icon: "headset", title: `${BL.user(s.userId).name} needs an agent`, sub: s.subject, href: `../ios/support-chat.html?id=${s.id}`, cta: "Reply" })),
    ];
    view.innerHTML = `
      <div class="page-head"><div><h1>Back office</h1><p>${fdate(BL.day(0), "long")} · ${BL.plural(attention.length, "thing")} to look at</p></div><a class="btn btn-primary" href="admin-reports.html">${icon("chart", "sm")}Reports</a></div>
      <div class="grid-stats mb-8">
        <a class="stat panel p-4 pressable" href="admin-reports.html"><span class="value" id="gmv" data-v="0">${money(0)}</span><span class="label muted">Taken through Dusk</span></a>
        <a class="stat panel p-4 pressable" href="admin-bookings.html"><span class="value">${live.length}</span><span class="label muted">Live bookings</span></a>
        <a class="stat panel p-4 pressable" href="admin-vendors.html?status=pending"><span class="value">${pendingVendors.length}</span><span class="label muted">Vendors awaiting review</span></a>
        <a class="stat panel p-4 pressable" href="../ios/support.html"><span class="value">${openSupport.length}</span><span class="label muted">Open support threads</span></a>
      </div>
      <div class="split">
        <div>
          <section class="section"><div class="section-title"><h2>Needs attention</h2></div>
            ${attention.length ? `<div class="panel px-4 stagger">${attention.map((a, i) => `<a class="row press" href="${a.href}" style="--i:${i}"><span class="tile">${icon(a.icon, "sm")}</span><span class="body"><span class="title block truncate">${esc(a.title)}</span><span class="sub block truncate">${esc(a.sub)}</span></span><span class="right"><span class="btn btn-secondary btn-sm">${a.cta}</span></span></a>`).join("")}</div>`
            : `<div class="empty panel"><span class="tile">${icon("check")}</span><h3>All clear</h3><p>Vendor applications, failed payments and half-confirmed plans show up here.</p></div>`}
          </section>
          <section class="section"><div class="section-title"><h2>Latest bookings</h2><a href="admin-bookings.html">All bookings</a></div><div id="recent"></div></section>
        </div>
        <div>
          <section class="section"><div class="section-title"><h2>Activity</h2></div>
            ${state.log.length ? `<div class="panel px-4">${state.log.slice(0, 8).map((l) => `<div class="row"><span class="tile">${icon("bolt", "sm")}</span><span class="body"><span class="title block truncate">${esc(l.text)}</span><span class="sub">${fstamp(l.at)}</span></span></div>`).join("")}</div>`
            : `<div class="empty panel"><span class="tile">${icon("bolt")}</span><h3>Nothing logged yet</h3><p>Approvals, refunds and edits made here are listed as they happen.</p></div>`}
          </section>
          <section class="section"><div class="section-title"><h2>Support</h2><a href="../ios/support.html">Inbox</a></div>
            ${openSupport.length ? `<div class="panel px-4">${openSupport.slice(0, 5).map((s) => `<a class="row press" href="../ios/support-chat.html?id=${s.id}"><span class="tile">${icon("headset", "sm")}</span><span class="body"><span class="title block truncate">${esc(s.subject)}</span><span class="sub block truncate">${esc(BL.user(s.userId).name)} · ${fstamp(s.updatedAt)}</span></span><span class="right">${BL.badge(s.status)}</span></a>`).join("")}</div>`
            : `<div class="empty panel"><span class="tile">${icon("headset")}</span><h3>Inbox is clear</h3><p>Threads the concierge hands to a person land here.</p></div>`}
          </section>
        </div>
      </div>`;
    BL.countUp(document.getElementById("gmv"), rep.gmv, money);
    BL.webTable(document.getElementById("recent"), { rows: state.bookings.slice().sort((a, b) => b.createdAt.localeCompare(a.createdAt)).slice(0, 8), sort: "createdAt", dir: "desc", href: (b) => `admin-booking.html?id=${b.id}`, pageSize: 8,
      cols: [{ key: "code", label: "Code", render: (b) => `<span class="num">${b.code}</span>` }, { key: "guest", label: "Member", sort: (b) => BL.user(b.userId).name, render: (b) => esc(BL.user(b.userId).name) }, { key: "title", label: "Plan", render: (b) => `<span class="truncate">${esc(b.title)}</span>` }, { key: "total", label: "Total", num: true, render: (b) => money(b.total) }, { key: "status", label: "Status", render: (b) => BL.badge(b.status) }],
      card: (b) => ({ title: `${b.code} · ${esc(BL.user(b.userId).name)}`, meta: `${esc(b.title)} · ${money(b.total)}`, right: BL.badge(b.status) }),
      empty: `<div class="empty panel"><span class="tile">${icon("calendar")}</span><h3>No bookings yet</h3><p>Every plan a member pays for appears here.</p></div>` });
  })();
</script>
</body>
</html>
